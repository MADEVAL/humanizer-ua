interface:
  display_name: "Humanizer UA"
  short_description: "Редактура українського тексту без слідів ШІ, канцеляриту й суржику"
  default_prompt: >-
    Відредагуй цей український текст: прибери сліди ШІ, канцелярит, суржик і кальки.
    Не додавай фактів, збережи числа, імена, умови й голос автора.
policy:
  allow_implicit_invocation: true
